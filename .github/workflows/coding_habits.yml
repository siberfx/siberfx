name: coding habits

on:
  schedule:
    # 06:00 UTC daily (09:00 Europe/Istanbul). GitHub cron is always UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Prevent overlapping runs from racing on the committed SVG.
concurrency:
  group: coding-habits
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate coding_habits.svg
        uses: lowlighter/metrics@v3.34
        with:
          # Requires a Personal Access Token stored as the METRICS_TOKEN secret.
          # GITHUB_TOKEN is NOT sufficient for the habits plugin.
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/coding_habits.svg
          # base header shows lifetime stats (commits, PRs, issues, stars).
          # base_indepth aggregates commits across ALL repos/years for an
          # accurate all-time total (costs extra API calls; needs repo scope).
          base: header
          base_indepth: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_from: 200
          # Isometric contribution calendar (last 12 months) with streak +
          # per-day average. Its total is last-year; lifetime total lives in
          # the base_indepth header above.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Istanbul
          # Let git-auto-commit-action handle publishing instead of the action.
          output_action: none

      - name: upload coding habits artifact
        uses: actions/upload-artifact@v4
        with:
          name: coding-habits
          path: metrics/coding_habits.svg
          if-no-files-found: error

      - name: commit coding_habits.svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: metrics/coding_habits.svg
          commit_message: "chore: update coding habits metrics"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
